<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><rect width="100%" height="100%" fill="#f4f7fa"/><g font-family="Segoe UI,Arial,sans-serif" fill="#122235"><text x="32" y="40" font-size="23">F-TRACE2 independent evidence coverage</text><text x="32" y="86" font-size="14">Numerical saved original 24-leaf gates: saved_original_24_leaf_gates_verified</text><text x="32" y="123" font-size="14">Native export / original inventory: partial</text><text x="32" y="160" font-size="14">Internal current-micro source / annotations / timing: observability_not_pass</text><text x="32" y="197" font-size="14">ENTRY producer / fusion association: not_observed</text><text x="32" y="234" font-size="14">Same-instance coverage / handle cleanup: verified_all_instances</text><text x="32" y="286" font-size="12">Layers stay separate: export and numerical pass do not prove native costs or scientific admission.</text><text x="32" y="328" font-size="14">micro_first.synchronize: inconclusive; contained dt_min=13.2498 s</text><text x="32" y="362" font-size="14">micro_first.ready_only: inconclusive</text><text x="32" y="396" font-size="14">micro_repeat.synchronize: inconclusive; contained dt_min=14.3462 s</text><text x="32" y="464" font-size="12">Job CPU gate: ≥30 s contained samples, adjacent dt_max ≤2.5 s. No sum of two waits.</text><text x="32" y="491" font-size="12">Observed unions can include waiting/scheduling; missing producer observations remain null.</text></g></svg>