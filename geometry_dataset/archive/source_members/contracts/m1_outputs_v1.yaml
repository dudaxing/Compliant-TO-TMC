kernel:
  api: "ke_q4(E,nu,hx,hy,t,formulation)"
  local_node_order: [BL, BR, TR, TL]
  dof_order_per_node: [ux, uy]
  integration: full_2x2_gauss
  thickness_included_exactly_once: true
  post_assembly_symmetrization: forbidden
  formulations: [plane_stress, plane_strain]
  assembly: sparse_COO_to_CSC
  solver: scipy_splu
  homogeneous_Dirichlet: reduced_free_free_system
  reaction_residual: "r=(K_struct+K_spring)u-f_applied"

numbering:
  project_node_id: "iy*(nelx+1)+ix"
  project_element_id: "iy*nelx+ix"
  project_storage: y_major_x_fast
  auto_node_id: "ix*(nely+1)+iy"
  auto_element_id: "iy+ix*nely"
  auto_storage: x_major_y_fast
  auto_to_project_component_transform: [[1.0, 0.0], [0.0, -1.0]]

auto_compat_v1:
  role: verification_only
  formulation: plane_stress
  material_interpolation: "Emin+(Emax-Emin)*(rho+0.01)^penal"
  verified_states: [solid, uniform_vf, random_seed0, final]
  maximum_full_field_relative_L2_error: 4.981600530220604e-13
  metric_mapping: "q_project=-J_AuTO"

project_ports:
  physical_width_mm: 2.0
  quadrature: trapezoidal_tributary_length
  weights_sum_to_one: true
  total_force: "f=F*b"
  averaged_displacement: "q=b^T*u"
  work_conjugacy: "f^T*u=F*q"
  ground_spring: "K_s=k*b*b^T"
  spring_energy: "0.5*k*q^2"
  directions_must_be_unit_vectors: true
  non_unit_policy: reject_without_normalization

reaction_and_symmetry:
  support_reaction: constrained_entries_of_full_residual
  ground_spring_force_on_structure: "-K_s*u"
  global_balance: "f_applied+f_spring+R_support=0"
  half_to_full_displacement_parity: {ux: even, uy: odd}
  full_model_loads: two_mirrored_half_model_loads
  full_model_springs: two_independent_mirrored_rank_one_springs
  full_model_energy_multiplier: 2.0

