schema_version: "1.3-m1-closed"
contract_id: benchmark_v1.1
contract_status: frozen_m1_output_pending_next_milestone_resign
language: zh-CN
relationship_to_v1:
  path: contracts/benchmark_v1.yaml
  canonical_fingerprint: 42877d24b4f4be386d0fdac83d51df96d69e76c57ee10686af6d1289a8248483
  file_sha256: 1a09b18154bfa5b5e5d691921a4fbe560574a638dcfd828fc25f6723c543cf14
  modified_in_place: false
  change_scope: M1生产配置、D11编号、端口物理与LF载荷类型的追加冻结

units:
  length: mm
  force: N
  stress: MPa
  spring_stiffness: N_per_mm

geometry:
  length_mm: 80.0
  half_height_ratio: 0.5
  thickness_mm: 20.0
  half_model: true
  origin: bottom_left
  axes: {x: right, y: up}

mesh:
  nelx: 160
  nely: 80
  status: frozen_by_M1_SG005
  require_source_boundaries_on_grid: true
  qualification:
    compared_meshes: [[40, 20], [80, 40], [160, 80], [320, 160]]
    primary_direct_change_160_to_320: 0.00373371776510653
    richardson_valid: true
    richardson_relative_error_at_160: 0.00585252821386596

artifact_layout:
  shape_order: [nely, nelx]
  row_axis: y
  column_axis: x
  origin: bottom_left
  solid_value: 1.0
  void_value: 0.0
  density_fields: [x_design, rho_filtered, rho_physical, rho_binary]

numbering_D11:
  project:
    node_id: "iy*(nelx+1)+ix"
    element_id: "iy*nelx+ix"
    storage: y_major_x_fast
    local_Q4_nodes: [BL, BR, TR, TL]
    dof_order_per_node: [ux, uy]
  auto_compat:
    node_id: "ix*(nely+1)+iy"
    element_id: "iy+ix*nely"
    storage: x_major_y_fast
    native_y_axis: down
  transform:
    integer_index_pairing: "(ix,iy)_AuTO maps to (ix,iy)_project"
    physical_effect: vertical_reflection
    component_transform: [[1.0, 0.0], [0.0, -1.0]]
    displacement: "u_project=T*u_AuTO"
    force: "f_project=T*f_AuTO"
    stiffness: "K_project=T*K_AuTO*T^T"

half_model_scaling:
  forces_are: per_half_model
  spring_stiffnesses_are: per_half_model
  reported_displacements_are: symmetry_invariant
  full_model_force_multiplier: 2.0
  full_model_spring_multiplier: 2.0
  mirrored_spring_implementation: two_independent_rank_one_springs

source_reference:
  scope: >-
    Only geometry dimensions, fixed/symmetry boundaries, and input/output
    locations and directions from Section 4.1.1, Figures 3 and 4, are used.
  fixed:
    edge: x0
    y_ratio: [0.0, 0.1]
    dofs: [ux, uy]
  input_point:
    x_ratio: 0.0
    y_ratio: 0.5
    direction: [1.0, 0.0]
  inverter:
    envelope_ratio: {x: [0.0, 1.0], y: [0.0, 0.5]}
    symmetry: {edge: y_top, x_ratio: [0.0, 1.0], dofs: [uy]}
    output_point: {x_ratio: 1.0, y_ratio: 0.5, direction: [-1.0, 0.0]}
  gripper:
    envelope_ratio: {x: [0.0, 1.0], y: [0.0, 0.5]}
    symmetry: {edge: y_top, x_ratio: [0.0, 0.75], dofs: [uy]}
    passive_void:
      x_ratio: [0.75, 1.0]
      y_ratio: [0.375, 0.5]
      evidence: inferred_from_figure_4
    passive_solid:
      x_ratio: [0.75, 1.0]
      y_ratio: [0.35, 0.375]
      evidence: inferred_from_figure_4
    output_point_or_face:
      x_ratio: 1.0
      y_ratio: [0.35, 0.375]
      direction: [0.0, 1.0]
  source_interpretation:
    passive_void_approved_by_project: true
    passive_solid_jaw_approved_by_project: true

port_regularization:
  source_points_remain_visible_in_plots: true
  enabled: true
  physical_width_mm: 2.0
  input_width_ratio_to_length: 0.025
  inverter_output_width_ratio_to_length: 0.025
  width_ratio_to_half_height: 0.05
  gripper_output_face_ratio: [0.35, 0.375]
  quadrature: trapezoidal_tributary_length
  weights_sum_to_one: true
  displacement_measure: work_conjugate_average
  load_form: distributed_total_force
  spring_form: rank_one_on_port_average
  point_self_compliance_role: singularity_diagnostic_not_k_ref

finite_element:
  type: Q4
  local_node_order: [BL, BR, TR, TL]
  integration: full_2x2_gauss
  stiffness_includes_thickness: true
  solver: scipy_splu
  verification_profile:
    name: auto_compat_v1
    formulation: plane_stress
    status: frozen_reference_only
  production_profile:
    name: project_inverter_v1
    formulation: plane_strain
    nu_LF: 0.30
    validated_contract_range: [0.0, 0.35]
    range_note: 仅nu=0.30执行正式生产点验证；区间是合同适用范围而非逐点采样声明
    status: frozen_by_M1
  design_transform_backend: jax_x64

scientific_objects:
  common_constraints:
    volume_fraction: null
    filter_length_physical_mm: null
    physical_min_feature_mm: null
    passive_regions_fixed: true
    common_geometry_transfer_pipeline: true
  low_fidelity_task:
    physics: linear_elastic_small_deformation
    contact: false
    actuation_type: force_control
    actuation_type_status: frozen_project_choice
    actuation_value_N: null
    actuation_value_status: deferred_until_formal_candidate_generation
    input_spring:
      enabled: true
      normalization: k_ref
      hat_value: null
      physical_value_N_per_mm: null
      value_status: deferred_until_formal_candidate_generation
    objective: maximize_signed_port_averaged_output_displacement
    varying_seed_fields: [output_spring_stiffness, start_seed]
  low_fidelity_seed:
    output_spring_normalization: k_ref
    output_spring_hat_grid: [0.0, 0.01, 0.03, 0.1, 0.3, 1.0, 3.0, 10.0, 30.0]
    starts_per_stiffness: 3
  generator:
    pilot_methods: [parameter_scan, multistart, anchor_designs]
    future_methods: [explicit_diversity, wasserstein_crossover]
  high_fidelity_task:
    version: null
    actuation: {type: displacement_control, value_mm: null}
    input_spring: none
    target_output_spring_N_per_mm: null
    material_model: null
    geometric_nonlinearity: true
    primary_metric: signed_port_averaged_output_displacement_along_target_direction
    feasibility:
      convergence_required: true
      required_output_direction: true
      maximum_strain: null

verification_reference:
  repository: UW-ERSL/AuTO
  commit: ba3c0c5dfc9acb7daff802aaf0bb41105296ad98
  environment_lockfile: env/auto-wsl-py311-freeze.txt
  profile: auto_compat_v1
  density_law: "Emin+(Emax-Emin)*(rho+0.01)^penal"
  snapshots: [solid, uniform_vf, random_seed0, final]
  semantic_addendum: milestones/M0/addenda/A001_auto_reference_semantics_v1.yaml
  allowed_changes: [import_path_compatibility, deprecated_api_compatibility, dtype_declaration, environment_compatibility, read_only_export_hooks]
  forbidden_changes: [governing_equations, boundary_conditions, physical_parameters, optimizer, filtering, projection, springs, objective_definition]

artifact_provenance:
  require_contract_fingerprint: true
  require_code_commit: true
  require_environment_fingerprint: true
  require_evaluator_version: true
  require_atomic_per_run_write: true
  hdf5_merge_mode: single_process
  failure_fields: [status, failure_stage, failure_code, solver_message]

failure_accounting:
  failures_consume_high_fidelity_budget: true
  silently_drop_failures: false
  report_two_part_outcome: true
  survival_metric: S_H
  conditional_ranking_metric: rho_LH_given_valid
  single_failure_utility: null

milestone_boundary:
  produced_by: M1
  M1_status: pending_SG006_closure
  M2_status: not_authorized
  next_use_requires_formal_resign: true
