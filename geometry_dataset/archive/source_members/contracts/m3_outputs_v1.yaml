API:
  auto_entry: dmftd.optimization.AutoEvaluator(profile=auto_validation)
  project_entry: dmftd.optimization.ProjectEvaluator(problem,transform,profile=project_validation,explicit_material_and_input_force)
  optimizer_entry: dmftd.optimization.run_optimization
  MMA_entry: dmftd.mma_adapter.FrozenMMA
  same_MMA_library_limit: wiring and behavior reconciled; no independent MMA algorithm
    validation
mathematics:
  scientific_objective: J=-bout.T@u=-q in signed mm, no abs or clipping
  project_design_chain: unchanged M2 double mask, physical filter, projection, SIMP
    and full transpose VJP
  project_MMA_only_scale_mm: 0.0037803699859865966
  project_scaled_inputs: J_MMA=J/J_scale and dJ_MMA=complete_dJ/J_scale; no extra
    sensitivity filter
  project_constraint: v_design/0.35-1; compact design-mask gradient
  volume_design: sum(rho_physical[Md])/count(Md)
  volume_total: mean(rho_physical)
  auto_definition: exact frozen A001/A002 physics, shifted material and historical
    sensitivity filter
  termination: fixed 200 updates; 201 states and final reanalysis; max_iterations
    does not imply convergence
handoff:
  density_array_convention: float64 (nely,nelx), bottom-left origin, y up, x right,
    C order x-fast
  displacement_array_convention: float64 (2*(nelx+1)*(nely+1),); node=iy*(nelx+1)+ix,
    dof=2*node+(0 for ux,1 for uy), physical x-right/y-up, mm
  element_moduli_array_convention: float64 (nely,nelx) in MPa, same element order
    as physical density
  mask_array_convention: bool (nely,nelx), disjoint design/passive-solid/passive-void
    partition
  compact_index_convention: int64 (n_design,), flatnonzero(design_mask.ravel(C));
    final raw passive placeholders remain zero
  grid_selection: use each case source_profile nelx/nely and bound density_shape at
    the same 80x40 mm domain; inherited M1 production_mesh is a reference baseline,
    never a command to resize a 40x20 field
  final_state_index: 200
  keys:
    raw_design_x: final__raw_design_x
    rho_initial: final__rho_initial
    rho_filtered: final__rho_filtered
    rho_projected: final__rho_projected
    rho_physical: final__rho_physical
    u: final__u
    element_moduli: final__element_moduli
    compact_indices: compact_indices_C
    design_mask: design_mask
    passive_solid_mask: passive_solid_mask
    passive_void_mask: passive_void_mask
  physical_density_processing: M4 physical-density consumer must apply zero new filtering
    or projection
  raw_design_processing: raw x alone requires its bound source full density chain,
    once logically; recomputation count is not chain composition
  source_profile_vs_battery: source scalars use each saved p/beta/load/springs; a
    common M4 battery requires its own reviewed profile and cannot compare p2 source
    J directly with a p3 battery J
  scientific_units:
  - mm
  - N
  - MPa
