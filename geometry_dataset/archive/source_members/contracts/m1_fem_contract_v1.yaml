scope:
  overall_goal: 纯 NumPy/SciPy Q4 内核、约束求解、端口物理、反力与半全模型验证
  milestone_closure_authorized: false
  currently_authorized_subgate: solid
  currently_authorized_microgates: [q4, d11, edof, assembly, auto_bc_springs, solid_solve]
  authorization_stops_after_solid_result: true

units:
  length: arbitrary_consistent_for_auto_compat
  force: arbitrary_consistent_for_auto_compat
  stiffness: force_per_length
  project_production_units_inherited_from_benchmark: {length: mm, force: N, stress: MPa}

q4:
  api: "ke_q4(E, nu, hx, hy, t, formulation)"
  geometry_arguments_must_remain_separate: [hx, hy]
  canonical_local_node_order: [BL, BR, TR, TL]
  dof_order_per_node: [ux, uy]
  integration: full_2x2_gauss
  stiffness_includes_physical_thickness: true
  post_assembly_symmetrization_forbidden: true
  implemented_formulations_required: [plane_stress, plane_strain]

numbering_D11:
  project:
    axis_y: upward
    node_id: "n_P(ix,iy)=iy*(nelx+1)+ix"
    element_id: "e_P(ix,iy)=iy*nelx+ix"
    storage: y_major_x_fast
  auto:
    axis_y: downward
    node_id: "n_A(ix,iy)=ix*(nely+1)+iy"
    element_id: "e_A(ix,iy)=iy+ix*nely"
    storage: x_major_y_fast
  index_pairing: "n_A(ix,iy) maps to n_P(ix,iy); equal integer iy represents a physical y reflection"
  component_transform: [[1.0, 0.0], [0.0, -1.0]]
  forward:
    displacement: "u_P=T*u_A"
    force: "f_P=T*f_A"
    stiffness: "K_P=T*K_A*T^T"
  inverse:
    displacement: "u_A=T^T*u_P"
    force: "f_A=T^T*f_P"
  required_invariants:
    - node_and_dof_bijection
    - exact_vector_roundtrip
    - "T^T*T=I"
    - "f_P^T*u_P=f_A^T*u_A"

direction_vectors:
  normalization_policy: reject_non_unit_do_not_renormalize
  norm: euclidean
  absolute_tolerance: 1.0e-12
  inverter_input: [1.0, 0.0]
  inverter_output: [-1.0, 0.0]

formulation_profiles:
  auto_compat_v1:
    purpose: verification_against_frozen_AuTO
    status: frozen
    formulation: plane_stress
    q4_reference: top88_analytic_unit_square
    thickness: 1.0
    load: single_input_x_dof_force
    springs: two_diagonal_point_springs
    material_interpolation: "Emin+(Emax-Emin)*(rho+0.01)^penal"
    project_output_direction: [-1.0, 0.0]
    metric_relation: "q_project=-J_auto"
  project_production:
    purpose: low_fidelity_candidate_generation
    status: provisional
    initial_candidate: standard_plane_strain
    decision_due_at: M1_closure
    candidates:
      - standard_plane_strain
      - selective_reduced_integration
      - b_bar
      - mixed_u_p
      - moderate_nu_surrogate
    minimum_implemented_now: [plane_stress, standard_plane_strain]

solid_subgate:
  state: solid
  density: 1.0
  mesh: {nelx: 40, nely: 20, hx: 1.0, hy: 1.0, thickness: 1.0}
  material: {Emax: 1.0, Emin: 0.001, nu: 0.3, penal: 3.0, density_shift: 0.01}
  effective_E: 1.0302706990000001
  auto_dofs: {ndof: 1722, fixed_count: 45, free_count: 1677, input_x: 40, output_x: 1720}
  project_dofs_after_D11: {input_x: 1640, output_x: 1720}
  frozen_reference:
    displacement: reference/auto_inverter_40x20/snapshots/solid/u.npy
    u_in_x: 4.678865334489868
    u_out_x: 1.0019820252752838
    J_auto: 1.0019820252752838
    q_project: -1.0019820252752838
  six_microgates:
    - q4
    - d11
    - edof
    - assembly
    - auto_bc_springs
    - solid_solve
  acceptance:
    q4_top88_relative_frobenius_max: 1.0e-12
    q4_exact_rigid_body_mode_count: 3
    dense_sparse_relative_frobenius_max: 1.0e-10
    displacement_relative_l2_max: 1.0e-9
    free_dof_residual_relative_max: 1.0e-11
    u_in_abs_error_max: 5.0e-10
    u_out_abs_error_max: 5.0e-10
    J_auto_abs_error_max: 5.0e-10

blocked_until_separate_authorization:
