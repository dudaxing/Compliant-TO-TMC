[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "independent-hf-evaluator"
version = "0.3.0"
description = "Independent geometry diagnostics and a source-numeric Q1 third-medium benchmark"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["numpy==2.4.6", "scipy==1.17.1", "matplotlib==3.10.9", "jax==0.11.0", "jaxlib==0.11.0"]

[project.scripts]
hf-eval = "hf_eval.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
